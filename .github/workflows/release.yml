name: Release

# Push a semver tag to release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Runs the full test suite, creates a GitHub Release with generated notes,
# then tells Packagist to re-crawl the repository so the new version appears.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   PACKAGIST_USERNAME   your packagist.org username
#   PACKAGIST_TOKEN      your Packagist "Main API token" (packagist.org/profile)
#
# The package must already be submitted once at https://packagist.org/packages/submit.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  github-release:
    name: GitHub Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          flags=(--generate-notes --verify-tag --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" "${flags[@]}"

  packagist:
    name: Update Packagist
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: packagist
      url: https://packagist.org/packages/webdevs-com-au/machship
    steps:
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [[ -z "$PACKAGIST_USERNAME" || -z "$PACKAGIST_TOKEN" ]]; then
            echo "::error::PACKAGIST_USERNAME and PACKAGIST_TOKEN secrets must be set."
            exit 1
          fi

          response=$(curl --silent --show-error --write-out '\n%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_TOKEN}" \
            --data "{\"repository\":\"${REPOSITORY_URL}\"}" \
            'https://packagist.org/api/update-package')

          status=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")
          echo "Packagist responded with HTTP $status: $body"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "::error::Packagist update failed (HTTP $status)."
            exit 1
          fi
